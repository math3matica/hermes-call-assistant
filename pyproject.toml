[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-voice-mode"
version = "0.1.0"
description = "Conservative Rex Voice runtime boundary and Hermes plugin adapter"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
rex-voice-mode = "rex_voice_mode.cli:main"
rex-call-voice = "rex_voice_v1.launch:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rex_voice_mode*", "rex_voice_v1*"]

[tool.setuptools.package-data]
rex_voice_v1 = ["*.ts", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
