[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-call-assistant"
version = "0.1.0"
description = "Conservative call assistant runtime boundary and Hermes plugin adapter"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hermes-call-assistant = "rex_voice_mode.cli:main"
hermes-call-assistant-runtime = "rex_voice_v1.launch:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rex_voice_mode*", "rex_voice_v1*"]

[tool.setuptools.package-data]
rex_voice_v1 = ["*.ts", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
